<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Viento Local - Pronóstico 8hs</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 100%; margin: 0 auto; }
        header {
            text-align: center;
            padding: 16px;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { font-size: 1.3rem; color: #38bdf8; }
        header p { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
        
        .controls {
            padding: 12px 16px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .location-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .location-bar input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }
        .btn {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-secondary { background: #334155; }
        .btn-success { background: #10b981; }
        .btn-sm { padding: 6px 10px; font-size: 0.75rem; }
        
        .favorites {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .fav-chip {
            background: #0f172a;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .fav-chip:hover { border-color: #0ea5e9; color: #0ea5e9; }
        .fav-chip .remove { color: #ef4444; font-weight: bold; }
        
        .status {
            text-align: center;
            padding: 16px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .status.error { color: #f87171; }
        .status.loading { color: #38bdf8; }
        
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            margin: 12px 16px;
            overflow: hidden;
        }
        .card-header {
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            font-size: 0.85rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #map {
            height: 280px;
            width: 100%;
            background: #0f172a;
        }
        .wind-popup {
            text-align: center;
            font-size: 0.85rem;
        }
        .wind-popup .speed { font-size: 1.3rem; font-weight: 700; color: #38bdf8; }
        .wind-popup .dir { color: #94a3b8; }
        
        .current-wind {
            text-align: center;
            padding: 24px 16px;
        }
        .wind-speed {
            font-size: 5rem;
            font-weight: 800;
            color: #38bdf8;
            line-height: 1;
            text-shadow: 0 0 30px rgba(56,189,248,0.3);
        }
        .wind-unit { font-size: 1.3rem; color: #64748b; }
        .wind-dir {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.1rem;
        }
        .compass {
            width: 48px; height: 48px;
            border: 3px solid #475569;
            border-radius: 50%;
            position: relative;
            background: #0f172a;
        }
        .compass-arrow {
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 20px solid #f59e0b;
            transform-origin: 50% 100%;
            margin-left: -6px;
            margin-top: -20px;
        }
        .compass-labels {
            position: absolute;
            width: 100%; height: 100%;
        }
        .compass-labels span {
            position: absolute;
            font-size: 0.6rem;
            color: #64748b;
            font-weight: bold;
        }
        .compass-labels .n { top: 2px; left: 50%; transform: translateX(-50%); }
        .compass-labels .e { right: 2px; top: 50%; transform: translateY(-50%); }
        .compass-labels .s { bottom: 2px; left: 50%; transform: translateX(-50%); }
        .compass-labels .w { left: 2px; top: 50%; transform: translateY(-50%); }
        
        .wind-detail {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 16px 16px;
        }
        .detail-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .detail-box .label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-box .value { font-size: 1.2rem; font-weight: 700; color: #e2e8f0; margin-top: 4px; }
        
        .forecast-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 16px 16px;
            scrollbar-width: none;
        }
        .forecast-grid::-webkit-scrollbar { display: none; }
        .forecast-item {
            min-width: 70px;
            background: #0f172a;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .forecast-item.highlight {
            border-color: #0ea5e9;
            background: rgba(14, 165, 233, 0.1);
        }
        .forecast-item .time { font-size: 0.7rem; color: #64748b; margin-bottom: 8px; }
        .forecast-item .dir-icon { font-size: 1.4rem; margin: 4px 0; }
        .forecast-item .speed { font-size: 1.2rem; font-weight: 700; color: #e2e8f0; }
        .forecast-item .gust { font-size: 0.7rem; color: #f87171; margin-top: 2px; }
        .forecast-item .temp { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
        
        .chart-container {
            height: 160px;
            padding: 0 16px 16px;
        }
        canvas { width: 100%; height: 100%; }
        
        .alert-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #fbbf24;
            margin: 0 16px 16px;
            display: none;
        }
        .alert-box.show { display: block; }
        .alert-box.danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        
        .sources {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px;
            flex-wrap: wrap;
        }
        .source-badge {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: #0f172a;
            color: #64748b;
        }
        .source-badge.active { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        
        .last-update {
            text-align: center;
            font-size: 0.7rem;
            color: #475569;
            padding: 16px;
        }
        
        .legend-map {
            position: absolute;
            bottom: 10px; right: 10px;
            background: rgba(15, 23, 42, 0.9);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            z-index: 1000;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
        .legend-color { width: 20px; height: 8px; border-radius: 2px; }
        
        .hidden { display: none !important; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse { animation: pulse 1.5s infinite; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌬️ Viento Local</h1>
            <p>Pronóstico horario · Próximas 8 horas · GPS + Mapa</p>
        </header>
        
        <div class="controls">
            <div class="location-bar">
                <input type="text" id="cityInput" placeholder="Buscar ciudad..." />
                <button class="btn btn-secondary" onclick="searchCity()">🔍</button>
                <button class="btn" onclick="getGPS()">📍 GPS</button>
                <button class="btn btn-success btn-sm" onclick="addFavorite()">⭐</button>
            </div>
            <div class="favorites" id="favoritesList">
                <span style="font-size:0.75rem;color:#64748b;">Favoritos:</span>
            </div>
        </div>
        
        <div id="status" class="status">Tocá 📍 para usar tu ubicación o buscá una ciudad</div>
        
        <div id="mainContent" class="hidden">
            <!-- MAPA -->
            <div class="card">
                <div class="card-header">
                    <span>🗺️ Mapa de viento</span>
                    <span style="font-size:0.7rem;color:#64748b;">km/h</span>
                </div>
                <div id="map"></div>
            </div>
            
            <!-- VIENTO ACTUAL -->
            <div class="card" id="currentCard">
                <div class="current-wind">
                    <div class="wind-speed" id="currentSpeed">--</div>
                    <div class="wind-unit">km/h</div>
                    <div class="wind-dir">
                        <div class="compass">
                            <div class="compass-labels">
                                <span class="n">N</span>
                                <span class="e">E</span>
                                <span class="s">S</span>
                                <span class="w">O</span>
                            </div>
                            <div class="compass-arrow" id="compassArrow"></div>
                        </div>
                        <span id="currentDir">--° --</span>
                    </div>
                </div>
                <div class="wind-detail">
                    <div class="detail-box">
                        <div class="label">Ráfagas</div>
                        <div class="value" id="currentGust">--</div>
                    </div>
                    <div class="detail-box">
                        <div class="label">Temperatura</div>
                        <div class="value" id="currentTemp">--°</div>
                    </div>
                    <div class="detail-box">
                        <div class="label">Humedad</div>
                        <div class="value" id="currentHum">--%</div>
                    </div>
                </div>
                <div class="alert-box" id="alertBox"></div>
            </div>
            
            <!-- PRONÓSTICO -->
            <div class="card" id="forecastCard">
                <div class="card-header">
                    <span>📊 Pronóstico 8 horas</span>
                    <div class="sources">
                        <span class="source-badge active">Open-Meteo Best Match</span>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="windChart"></canvas>
                </div>
                <div class="forecast-grid" id="forecastGrid"></div>
            </div>
        </div>
        
        <div class="last-update" id="lastUpdate"></div>
    </div>

    <script>
        let map = null;
        let windLayer = null;
        let currentLat = null;
        let currentLon = null;
        let currentCity = '';
        let forecastData = [];
        let favorites = JSON.parse(localStorage.getItem('windFavorites') || '[]');
        
        // Inicializar favoritos
        function renderFavorites() {
            const list = document.getElementById('favoritesList');
            list.innerHTML = '<span style="font-size:0.75rem;color:#64748b;">Favoritos:</span>';
            favorites.forEach((fav, idx) => {
                const chip = document.createElement('span');
                chip.className = 'fav-chip';
                chip.innerHTML = `${fav.name} <span class="remove" onclick="removeFavorite(${idx}, event)">×</span>`;
                chip.onclick = (e) => { if(e.target.className !== 'remove') loadFavorite(fav); };
                list.appendChild(chip);
            });
        }
        renderFavorites();
        
        function addFavorite() {
            if (!currentLat || !currentLon) return;
            const name = currentCity || `${currentLat.toFixed(2)}, ${currentLon.toFixed(2)}`;
            if (!favorites.find(f => f.name === name)) {
                favorites.push({ name, lat: currentLat, lon: currentLon });
                localStorage.setItem('windFavorites', JSON.stringify(favorites));
                renderFavorites();
            }
        }
        
        function removeFavorite(idx, e) {
            e.stopPropagation();
            favorites.splice(idx, 1);
            localStorage.setItem('windFavorites', JSON.stringify(favorites));
            renderFavorites();
        }
        
        function loadFavorite(fav) {
            currentLat = fav.lat;
            currentLon = fav.lon;
            currentCity = fav.name;
            document.getElementById('cityInput').value = fav.name;
            fetchWeather(fav.lat, fav.lon);
        }
        
        // Utilidades
        function degToCardinal(deg) {
            const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
            return dirs[Math.round(deg / 22.5) % 16];
        }
        
        function getArrowUnicode(deg) {
            const arrows = ['↑','↗','→','↘','↓','↙','←','↖'];
            return arrows[Math.round(deg / 45) % 8];
        }
        
        function windColor(speed) {
            if (speed < 10) return '#10b981';
            if (speed < 20) return '#38bdf8';
            if (speed < 30) return '#f59e0b';
            if (speed < 40) return '#f97316';
            return '#ef4444';
        }
        
        function formatHour(iso) {
            const d = new Date(iso);
            return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        }
        
        function showStatus(msg, type = '') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + type;
        }
        
        // GPS
        function getGPS() {
            if (!navigator.geolocation) {
                showStatus('Tu navegador no soporta geolocalización', 'error');
                return;
            }
            showStatus('Obteniendo ubicación GPS...', 'loading');
            navigator.geolocation.getCurrentPosition(
                pos => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    document.getElementById('cityInput').value = `${currentLat.toFixed(3)}, ${currentLon.toFixed(3)}`;
                    fetchWeather(currentLat, currentLon);
                },
                err => {
                    let msg = 'Error al obtener GPS';
                    if (err.code === 1) msg = 'Permiso de ubicación denegado. Usá la búsqueda manual.';
                    showStatus(msg, 'error');
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }
        
        // Búsqueda por ciudad
        async function searchCity() {
            const q = document.getElementById('cityInput').value.trim();
            if (!q) return;
            showStatus('Buscando ubicación...', 'loading');
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=es&format=json`);
                const data = await res.json();
                if (!data.results || data.results.length === 0) {
                    showStatus('Ciudad no encontrada', 'error');
                    return;
                }
                const r = data.results[0];
                currentLat = r.latitude;
                currentLon = r.longitude;
                currentCity = r.name;
                document.getElementById('cityInput').value = `${r.name}, ${r.admin1 || ''}, ${r.country || ''}`;
                fetchWeather(currentLat, currentLon);
            } catch (e) {
                showStatus('Error de conexión', 'error');
            }
        }
        
        // Inicializar mapa
        function initMap(lat, lon) {
            if (!map) {
                map = L.map('map', { zoomControl: false }).setView([lat, lon], 10);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap &copy; CARTO',
                    subdomains: 'abcd',
                    maxZoom: 19
                }).addTo(map);
            } else {
                map.setView([lat, lon], 10);
            }
        }
        
        // Agregar marcadores de viento alrededor
        async function addWindMarkers(lat, lon) {
            if (windLayer) map.removeLayer(windLayer);
            windLayer = L.layerGroup().addTo(map);
            
            // Puntos alrededor (5km de radio)
            const offsets = [
                [0, 0], [0.05, 0], [-0.05, 0], [0, 0.05], [0, -0.05],
                [0.03, 0.03], [-0.03, -0.03], [0.03, -0.03], [-0.03, 0.03]
            ];
            
            for (const [dLat, dLon] of offsets) {
                const pLat = lat + dLat;
                const pLon = lon + dLon;
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pLat}&longitude=${pLon}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&timezone=auto`);
                    const data = await res.json();
                    if (data.current) {
                        const speed = Math.round(data.current.wind_speed_10m);
                        const dir = data.current.wind_direction_10m;
                        const color = windColor(speed);
                        
                        const icon = L.divIcon({
                            className: 'wind-marker',
                            html: `<div style="transform:rotate(${dir + 180}deg);color:${color};font-size:24px;text-shadow:0 0 10px ${color}80;">➤</div>`,
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });
                        
                        const marker = L.marker([pLat, pLon], { icon }).addTo(windLayer);
                        marker.bindPopup(`
                            <div class="wind-popup">
                                <div class="speed">${speed} km/h</div>
                                <div class="dir">${degToCardinal(dir)} ${Math.round(dir)}°</div>
                                <div style="font-size:0.75rem;color:#64748b;margin-top:4px;">Ráf: ${Math.round(data.current.wind_gusts_10m)} km/h</div>
                            </div>
                        `);
                    }
                } catch (e) {}
            }
        }
        
        // Fetch datos
        async function fetchWeather(lat, lon) {
            showStatus('Consultando proveedor meteorológico...', 'loading');
            try {
                // IMPORTANTE: sin &models=... para que Open-Meteo use “best match”.
                // Con varios modelos, la respuesta puede cambiar nombres de campos y romper renderCurrent/renderForecast.
                const params = new URLSearchParams({
                    latitude: lat,
                    longitude: lon,
                    current: 'temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
                    hourly: 'wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m',
                    forecast_hours: 12,
                    timezone: 'auto',
                    wind_speed_unit: 'kmh'
                });
                const url = `https://api.open-meteo.com/v1/forecast?${params.toString()}`;
                const res = await fetch(url, { cache: 'no-store' });
                const data = await res.json();

                if (!res.ok || data.error) {
                    throw new Error(data.reason || `HTTP ${res.status}`);
                }
                if (!data.current || !data.hourly) {
                    throw new Error('Respuesta incompleta del proveedor meteorológico');
                }
                
                initMap(lat, lon);
                addWindMarkers(lat, lon);
                
                renderCurrent(data.current);
                renderForecast(data.hourly);
                
                document.getElementById('mainContent').classList.remove('hidden');
                showStatus('');
                document.getElementById('lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleString('es-AR');
            } catch (e) {
                showStatus('Error al obtener datos meteorológicos: ' + e.message, 'error');
                console.error(e);
            }
        }
        
        function renderCurrent(cur) {
            const speed = Math.round(cur.wind_speed_10m);
            document.getElementById('currentSpeed').textContent = speed;
            document.getElementById('currentSpeed').style.color = windColor(speed);
            document.getElementById('currentDir').textContent = `${Math.round(cur.wind_direction_10m)}° ${degToCardinal(cur.wind_direction_10m)}`;
            document.getElementById('currentGust').textContent = Math.round(cur.wind_gusts_10m) + ' km/h';
            document.getElementById('currentTemp').textContent = Math.round(cur.temperature_2m) + '°';
            document.getElementById('currentHum').textContent = cur.relative_humidity_2m + '%';
            
            document.getElementById('compassArrow').style.transform = `rotate(${cur.wind_direction_10m}deg)`;
            
            const alertBox = document.getElementById('alertBox');
            if (cur.wind_gusts_10m > 50) {
                alertBox.className = 'alert-box danger show';
                alertBox.textContent = `🚨 RÁFAGAS CRÍTICAS: ${Math.round(cur.wind_gusts_10m)} km/h. SUSPENDER TRABAJOS EN ALTURA Y GRÚAS.`;
            } else if (cur.wind_gusts_10m > 40) {
                alertBox.className = 'alert-box show';
                alertBox.textContent = `⚠️ Ráfagas de ${Math.round(cur.wind_gusts_10m)} km/h. Precaución en operaciones expuestas.`;
            } else {
                alertBox.className = 'alert-box';
            }
        }
        
        function renderForecast(hourly) {
            const now = new Date();
            let startIndex = 0;
            for (let i = 0; i < hourly.time.length; i++) {
                if (new Date(hourly.time[i]) >= now) { startIndex = i; break; }
            }
            const endIndex = Math.min(startIndex + 8, hourly.time.length);
            forecastData = [];
            
            const grid = document.getElementById('forecastGrid');
            grid.innerHTML = '';
            
            let maxGust = 0;
            let dangerHours = [];
            
            for (let i = startIndex; i < endIndex; i++) {
                const speed = Math.round(hourly.wind_speed_10m[i]);
                const gust = Math.round(hourly.wind_gusts_10m[i]);
                const dir = hourly.wind_direction_10m[i];
                const temp = Math.round(hourly.temperature_2m[i]);
                const timeStr = formatHour(hourly.time[i]);
                const isNow = i === startIndex;
                
                if (gust > maxGust) maxGust = gust;
                if (gust > 50) dangerHours.push(timeStr);
                
                forecastData.push({ time: timeStr, speed, gust, dir, temp });
                
                const item = document.createElement('div');
                item.className = 'forecast-item' + (isNow ? ' highlight' : '');
                item.innerHTML = `
                    <div class="time">${isNow ? 'AHORA' : timeStr}</div>
                    <div class="dir-icon" style="color:${windColor(speed)}">${getArrowUnicode(dir)}</div>
                    <div class="speed">${speed}</div>
                    <div class="gust">raf ${gust}</div>
                    <div class="temp">${temp}°</div>
                `;
                grid.appendChild(item);
            }
            
            const alertBox = document.getElementById('alertBox');
            if (dangerHours.length > 0 && !alertBox.classList.contains('show')) {
                alertBox.className = 'alert-box danger show';
                alertBox.textContent = `🚨 Alerta: ráfagas >50 km/h previstas a las ${dangerHours.join(', ')}.`;
            } else if (maxGust > 40 && !alertBox.classList.contains('show')) {
                alertBox.className = 'alert-box show';
                alertBox.textContent = `⚠️ Máximas ráfagas previstas: ${maxGust} km/h.`;
            }
            
            drawChart();
        }
        
        function drawChart() {
            const canvas = document.getElementById('windChart');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            const w = rect.width, h = rect.height;
            const pad = { t: 20, r: 10, b: 30, l: 35 };
            const cw = w - pad.l - pad.r;
            const ch = h - pad.t - pad.b;
            
            ctx.clearRect(0, 0, w, h);
            if (forecastData.length === 0) return;
            
            const maxVal = Math.max(...forecastData.map(d => d.gust), ...forecastData.map(d => d.speed)) * 1.2;
            
            // Grid
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = pad.t + (ch / 4) * i;
                ctx.beginPath();
                ctx.moveTo(pad.l, y);
                ctx.lineTo(w - pad.r, y);
                ctx.stroke();
                ctx.fillStyle = '#64748b';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(Math.round(maxVal - (maxVal / 4) * i), pad.l - 6, y + 3);
            }
            
            // Área velocidad
            ctx.beginPath();
            forecastData.forEach((d, i) => {
                const x = pad.l + (cw / (forecastData.length - 1)) * i;
                const y = pad.t + ch - (d.speed / maxVal) * ch;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.lineTo(pad.l + cw, pad.t + ch);
            ctx.lineTo(pad.l, pad.t + ch);
            ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
            ctx.fill();
            
            // Línea velocidad
            ctx.beginPath();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.5;
            forecastData.forEach((d, i) => {
                const x = pad.l + (cw / (forecastData.length - 1)) * i;
                const y = pad.t + ch - (d.speed / maxVal) * ch;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            
            // Línea ráfagas
            ctx.beginPath();
            ctx.strokeStyle = '#f87171';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 3]);
            forecastData.forEach((d, i) => {
                const x = pad.l + (cw / (forecastData.length - 1)) * i;
                const y = pad.t + ch - (d.gust / maxVal) * ch;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Puntos
            forecastData.forEach((d, i) => {
                const x = pad.l + (cw / (forecastData.length - 1)) * i;
                const y = pad.t + ch - (d.speed / maxVal) * ch;
                ctx.beginPath();
                ctx.fillStyle = '#0f172a';
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.fillStyle = '#38bdf8';
                ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Labels hora
            ctx.fillStyle = '#94a3b8';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            forecastData.forEach((d, i) => {
                const x = pad.l + (cw / (forecastData.length - 1)) * i;
                ctx.fillText(d.time, x, h - 8);
            });
            
            // Leyenda
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(w - 95, 6, 12, 3);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Viento', w - 78, 10);
            ctx.fillStyle = '#f87171';
            ctx.fillRect(w - 40, 6, 12, 3);
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('Ráfagas', w - 23, 10);
        }
        
        // Auto-detectar al cargar
        window.addEventListener('load', () => {
            renderFavorites();
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        currentLat = pos.coords.latitude;
                        currentLon = pos.coords.longitude;
                        document.getElementById('cityInput').value = `${currentLat.toFixed(3)}, ${currentLon.toFixed(3)}`;
                        fetchWeather(currentLat, currentLon);
                    },
                    () => {},
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        });
        
        window.addEventListener('resize', drawChart);
    </script>
</body>
</html>
