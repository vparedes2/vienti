<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Viento Local - v5.0 GitHub Debug</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0} html,body{width:100%;max-width:100%;overflow-x:hidden}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
    header{text-align:center;padding:18px 12px;background:linear-gradient(180deg,#0f172a,#1e293b);border-bottom:1px solid #334155;position:sticky;top:0;z-index:10}
    h1{font-size:1.35rem;color:#38bdf8}.sub{font-size:.8rem;color:#94a3b8;margin-top:4px}.version{font-size:.72rem;color:#22c55e;margin-top:4px;font-weight:700}
    .controls{padding:12px;background:#1e293b;border-bottom:1px solid #334155;width:100%}
    .grid{display:grid;grid-template-columns:1fr 54px 106px;gap:8px;width:100%}
    input{width:100%;min-width:0;background:#0f172a;border:1px solid #475569;color:#e2e8f0;padding:12px;border-radius:12px;font-size:1rem;outline:none}
    button{border:0;border-radius:12px;padding:12px 10px;color:white;font-weight:800;font-size:.9rem;cursor:pointer;touch-action:manipulation;white-space:nowrap}
    #btnSearch{background:#334155}#btnGps{background:#0ea5e9}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}#btnSave{background:#10b981}#btnMap{background:#334155}
    .favorites{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;color:#64748b;font-size:.8rem}.chip{background:#0f172a;border:1px solid #475569;color:#e2e8f0;border-radius:999px;padding:7px 10px;cursor:pointer}.chip .x{color:#f87171;margin-left:6px;font-weight:900}
    .status{padding:16px;text-align:center;color:#94a3b8;border-bottom:1px solid #1e293b;min-height:54px}.status.loading{color:#38bdf8}.status.error{color:#f87171}.status.ok{color:#22c55e}
    .debug{display:none;margin:10px 12px;background:#020617;border:1px solid #334155;border-radius:12px;padding:10px;font-size:.78rem;color:#cbd5e1;white-space:pre-wrap;word-break:break-word}.debug.show{display:block}
    .card{background:#1e293b;border:1px solid #334155;border-radius:18px;margin:12px;overflow:hidden}.card-header{padding:12px 14px;border-bottom:1px solid #334155;color:#94a3b8;font-size:.85rem;display:flex;justify-content:space-between;align-items:center}
    #map{height:300px;width:100%;background:#020617}.hidden{display:none!important}
    .compassMap{position:absolute;top:12px;right:12px;z-index:500;background:rgba(15,23,42,.88);border:1px solid #475569;border-radius:50%;width:74px;height:74px;color:#e2e8f0;font-weight:900;font-size:.72rem}.compassMap span{position:absolute}.compassMap .n{top:4px;left:50%;transform:translateX(-50%);color:#38bdf8}.compassMap .s{bottom:4px;left:50%;transform:translateX(-50%)}.compassMap .e{right:6px;top:50%;transform:translateY(-50%)}.compassMap .w{left:6px;top:50%;transform:translateY(-50%)}.compassMap:after{content:"";position:absolute;left:50%;top:14px;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:22px solid #f59e0b}
    .current{text-align:center;padding:24px 10px}.speed{font-size:5rem;font-weight:900;line-height:1;color:#38bdf8}.unit{font-size:1.25rem;color:#94a3b8}.dir{font-size:1.25rem;margin-top:14px;color:#e2e8f0}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px 16px}.box{background:#0f172a;border-radius:14px;padding:13px 6px;text-align:center}.box .l{font-size:.7rem;color:#64748b;text-transform:uppercase}.box .v{font-size:1.15rem;font-weight:900;margin-top:4px}.forecast{display:flex;gap:8px;overflow-x:auto;padding:0 14px 16px}.fi{min-width:78px;background:#0f172a;border-radius:14px;text-align:center;padding:10px 6px}.fi .t{font-size:.72rem;color:#64748b}.fi .a{font-size:1.5rem}.fi .sp{font-size:1.2rem;font-weight:900}.fi .g{font-size:.72rem;color:#f87171}.fi .te{font-size:.72rem;color:#94a3b8}
    @media(max-width:420px){.grid{grid-template-columns:1fr 50px 94px}button{font-size:.82rem;padding:12px 7px}.row2{grid-template-columns:1fr 1fr}.speed{font-size:4.6rem}}
  </style>
</head>
<body>
<header>
  <h1>🌬️ Viento Local</h1>
  <div class="sub">Pronóstico horario · Próximas 8 horas · GPS + Mapa</div>
  <div class="version" id="versionLabel">VERSIÓN v5.0 · GitHub Debug · 2026-05-03</div>
</header>
<div class="controls">
  <div class="grid">
    <input id="cityInput" placeholder="Buscar ciudad..." autocomplete="off" />
    <button id="btnSearch" type="button">🔍</button>
    <button id="btnGps" type="button">📍 GPS</button>
  </div>
  <div class="row2">
    <button id="btnSave" type="button">⭐ Guardar posición</button>
    <button id="btnMap" type="button">🛰️ Satélite</button>
  </div>
  <div class="favorites" id="favoritesList"><span>Favoritos:</span></div>
</div>
<div id="status" class="status">Tocá 📍 para usar tu ubicación o buscá una ciudad</div>
<div id="debug" class="debug"></div>
<main id="mainContent" class="hidden">
  <section class="card"><div class="card-header"><span>🗺️ Mapa de viento</span><span>flecha = de dónde viene</span></div><div id="map"></div></section>
  <section class="card"><div class="current"><div class="speed" id="currentSpeed">--</div><div class="unit">km/h</div><div class="dir" id="currentDir">--</div></div><div class="details"><div class="box"><div class="l">Ráfagas</div><div class="v" id="currentGust">--</div></div><div class="box"><div class="l">Temperatura</div><div class="v" id="currentTemp">--</div></div><div class="box"><div class="l">Humedad</div><div class="v" id="currentHum">--</div></div></div></section>
  <section class="card"><div class="card-header"><span>📊 Pronóstico 8 horas</span><span>Open‑Meteo</span></div><div class="forecast" id="forecastGrid"></div></section>
</main>
<script>
'use strict';
const APP_VERSION='v5.0-github-debug-2026-05-03';
let map=null, markerLayer=null, baseLayer=null, currentLat=null, currentLon=null, currentCity='', satellite=true;
let favorites=[];
try{favorites=JSON.parse(localStorage.getItem('windFavorites')||'[]')}catch(e){favorites=[]}
const $=id=>document.getElementById(id);
function log(msg){const d=$('debug');d.classList.add('show');d.textContent+='['+new Date().toLocaleTimeString('es-AR')+'] '+msg+'\n'}
function status(msg,type=''){const s=$('status');s.textContent=msg;s.className='status '+type;log(type.toUpperCase()+': '+msg)}
window.addEventListener('error',e=>status('Error JS: '+e.message+' línea '+e.lineno,'error'));
window.addEventListener('unhandledrejection',e=>status('Error async: '+(e.reason?.message||e.reason),'error'));
function degToCardinal(deg){const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];return dirs[Math.round(deg/22.5)%16]}
function color(v){if(v<10)return'#10b981';if(v<20)return'#38bdf8';if(v<30)return'#f59e0b';if(v<40)return'#f97316';return'#ef4444'}
function arrow(deg){const arrows=['↑','↗','→','↘','↓','↙','←','↖'];return arrows[Math.round(deg/45)%8]}
function hour(iso){return new Date(iso).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
function renderFavs(){const f=$('favoritesList');f.innerHTML='<span>Favoritos:</span>';favorites.forEach((fav,i)=>{const c=document.createElement('button');c.type='button';c.className='chip';c.innerHTML=fav.name+' <span class="x">×</span>';c.addEventListener('click',ev=>{if(ev.target.className==='x'){favorites.splice(i,1);localStorage.setItem('windFavorites',JSON.stringify(favorites));renderFavs();return} currentLat=fav.lat;currentLon=fav.lon;currentCity=fav.name;$('cityInput').value=fav.name;fetchWeather(fav.lat,fav.lon)});f.appendChild(c)})}
function savePos(){if(currentLat==null||currentLon==null){status('Primero buscá una ciudad o usá GPS, luego guardá la posición.','error');return}const def=currentCity||`${currentLat.toFixed(4)}, ${currentLon.toFixed(4)}`;const name=prompt('Nombre para guardar esta posición:',def);if(!name)return;favorites.push({name:name.trim(),lat:currentLat,lon:currentLon});localStorage.setItem('windFavorites',JSON.stringify(favorites));renderFavs();status('Posición guardada: '+name,'ok')}
async function searchCity(){const q=$('cityInput').value.trim();if(!q){status('Escribí una ciudad. Ejemplo: Neuquén','error');return}status('Buscando ciudad: '+q,'loading');const url='https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=5&language=es&format=json';log('FETCH '+url);const res=await fetch(url,{cache:'no-store'});const data=await res.json();if(!res.ok||data.error)throw new Error(data.reason||'Geocoding HTTP '+res.status);if(!data.results||!data.results.length){status('Ciudad no encontrada. Probá: Neuquén, Argentina','error');return}let r=data.results.find(x=>x.country_code==='AR')||data.results[0];currentLat=r.latitude;currentLon=r.longitude;currentCity=[r.name,r.admin1,r.country].filter(Boolean).join(', ');$('cityInput').value=currentCity;await fetchWeather(currentLat,currentLon)}
function getGPS(){if(!('geolocation' in navigator)){status('Este navegador no soporta GPS.','error');return}status('Solicitando permiso GPS...','loading');navigator.geolocation.getCurrentPosition(pos=>{currentLat=pos.coords.latitude;currentLon=pos.coords.longitude;currentCity='GPS '+currentLat.toFixed(4)+', '+currentLon.toFixed(4);$('cityInput').value=currentCity;fetchWeather(currentLat,currentLon)},err=>{let msg='Error GPS: '+err.message;if(err.code===1)msg='GPS denegado. En Chrome: ajustes del sitio → Ubicación → Permitir.';if(location.protocol!=='https:')msg+=' El GPS requiere HTTPS.';status(msg,'error')},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function initMap(lat,lon){if(typeof L==='undefined'){log('Leaflet no cargó. Se muestran datos sin mapa.');return}if(!map){map=L.map('map',{zoomControl:true}).setView([lat,lon],10);const m=$('map');const comp=document.createElement('div');comp.className='compassMap';comp.innerHTML='<span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">O</span>';m.appendChild(comp)}else{map.setView([lat,lon],10)}if(baseLayer)map.removeLayer(baseLayer);baseLayer=L.tileLayer(satellite?'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}':'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:satellite?'Tiles © Esri':'© OpenStreetMap'}).addTo(map);setTimeout(()=>map.invalidateSize(),250)}
async function addMarkers(lat,lon,cur){if(typeof L==='undefined'||!map)return;if(markerLayer)map.removeLayer(markerLayer);markerLayer=L.layerGroup().addTo(map);const pts=[[0,0],[.05,0],[-.05,0],[0,.05],[0,-.05],[.035,.035],[-.035,-.035],[.035,-.035],[-.035,.035]];for(const p of pts){const pLat=lat+p[0],pLon=lon+p[1];let speed=cur.wind_speed_10m,dir=cur.wind_direction_10m,gust=cur.wind_gusts_10m;const c=color(Math.round(speed));const icon=L.divIcon({className:'wind-marker',html:`<div style="transform:rotate(${dir+180}deg);color:${c};font-size:28px;text-shadow:0 0 10px ${c};">➤</div>`,iconSize:[34,34],iconAnchor:[17,17]});L.marker([pLat,pLon],{icon}).addTo(markerLayer).bindPopup(`<b>${Math.round(speed)} km/h</b><br>Viene de ${Math.round(dir)}° ${degToCardinal(dir)}<br>Ráfagas ${Math.round(gust)} km/h`)} }
async function fetchWeather(lat,lon){status('Consultando Open‑Meteo...','loading');const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m&forecast_days=2&timezone=auto';log('FETCH '+url);const res=await fetch(url,{cache:'no-store'});const data=await res.json();if(!res.ok||data.error)throw new Error(data.reason||'Open-Meteo HTTP '+res.status);renderCurrent(data.current);renderForecast(data.hourly);$('mainContent').classList.remove('hidden');initMap(lat,lon);addMarkers(lat,lon,data.current);status('Datos cargados correctamente · '+APP_VERSION,'ok')}
function renderCurrent(c){const sp=Math.round(c.wind_speed_10m),dir=c.wind_direction_10m;$('currentSpeed').textContent=sp;$('currentSpeed').style.color=color(sp);$('currentDir').textContent='Viene de '+Math.round(dir)+'° '+degToCardinal(dir);$('currentGust').textContent=Math.round(c.wind_gusts_10m)+' km/h';$('currentTemp').textContent=Math.round(c.temperature_2m)+'°';$('currentHum').textContent=Math.round(c.relative_humidity_2m)+'%'}
function renderForecast(h){const grid=$('forecastGrid');grid.innerHTML='';let start=0,now=new Date();for(let i=0;i<h.time.length;i++){if(new Date(h.time[i])>=now){start=i;break}}for(let i=start;i<Math.min(start+8,h.time.length);i++){const sp=Math.round(h.wind_speed_10m[i]),gu=Math.round(h.wind_gusts_10m[i]),dir=h.wind_direction_10m[i];const div=document.createElement('div');div.className='fi';div.innerHTML=`<div class="t">${i===start?'AHORA':hour(h.time[i])}</div><div class="a" style="color:${color(sp)}">${arrow(dir+180)}</div><div class="sp">${sp}</div><div class="g">raf ${gu}</div><div class="te">${Math.round(h.temperature_2m[i])}°</div>`;grid.appendChild(div)}}
function toggleMap(){satellite=!satellite;$('btnMap').textContent=satellite?'🛰️ Satélite':'🗺️ Callejero';if(currentLat!=null)initMap(currentLat,currentLon)}
function bind(){log('Iniciando '+APP_VERSION+' URL='+location.href);renderFavs();$('btnSearch').addEventListener('click',searchCity);$('btnGps').addEventListener('click',getGPS);$('btnSave').addEventListener('click',savePos);$('btnMap').addEventListener('click',toggleMap);$('cityInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchCity()});$('versionLabel').textContent='VERSIÓN '+APP_VERSION}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
</script>
</body>
</html>
